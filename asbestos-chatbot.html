<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>石綿（アスベスト）専門家チャットボット</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .header {
      text-align: center;
      padding: 16px 0 12px;
      border-bottom: 1px solid #2d2d44;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 1.4rem;
      color: #7eb8f7;
      font-weight: 600;
    }

    .header p {
      font-size: 0.8rem;
      color: #888;
      margin-top: 4px;
    }

    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .chat-window::-webkit-scrollbar {
      width: 6px;
    }

    .chat-window::-webkit-scrollbar-track {
      background: #16213e;
    }

    .chat-window::-webkit-scrollbar-thumb {
      background: #2d2d44;
      border-radius: 3px;
    }

    .message {
      display: flex;
      gap: 10px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .message.user .avatar {
      background-color: #2d5a8e;
      color: #7eb8f7;
    }

    .message.assistant .avatar {
      background-color: #1e3a2f;
      color: #4caf8a;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background-color: #1e3a5f;
      border: 1px solid #2d5a8e;
      border-top-right-radius: 4px;
    }

    .message.assistant .bubble {
      background-color: #16213e;
      border: 1px solid #2d2d44;
      border-top-left-radius: 4px;
    }

    .message.assistant .bubble.loading {
      color: #666;
      font-style: italic;
    }

    .input-area {
      padding-top: 12px;
      border-top: 1px solid #2d2d44;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    textarea {
      flex: 1;
      background-color: #16213e;
      border: 1px solid #2d2d44;
      border-radius: 10px;
      color: #e0e0e0;
      padding: 10px 14px;
      font-size: 0.92rem;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.5;
      min-height: 44px;
      max-height: 140px;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #3a6ea8;
    }

    textarea::placeholder {
      color: #555;
    }

    button {
      background-color: #2d5a8e;
      color: #e0e0e0;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      font-size: 0.92rem;
      cursor: pointer;
      transition: background-color 0.2s;
      white-space: nowrap;
      align-self: flex-end;
      height: 44px;
    }

    button:hover:not(:disabled) {
      background-color: #3a6ea8;
    }

    button:disabled {
      background-color: #1e3a5f;
      color: #555;
      cursor: not-allowed;
    }

    .error-msg {
      color: #e57373;
      background-color: #2a1515;
      border: 1px solid #c62828;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
      margin: 4px 0;
    }

    .welcome {
      text-align: center;
      padding: 40px 20px;
      color: #555;
    }

    .welcome .icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .welcome p {
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .welcome .examples {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .example-btn {
      background-color: #16213e;
      border: 1px solid #2d2d44;
      color: #888;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      height: auto;
    }

    .example-btn:hover {
      background-color: #1e2d4a;
      border-color: #3a4a6a;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚠️ 石綿（アスベスト）専門家</h1>
      <p>危険性・法規制・除去方法・健康被害・調査方法についてお答えします</p>
    </div>

    <div class="chat-window" id="chatWindow">
      <div class="welcome" id="welcomeMsg">
        <div class="icon">🔬</div>
        <p>石綿（アスベスト）に関するご質問をどうぞ。<br>専門的な情報をお伝えします。</p>
        <div class="examples">
          <button class="example-btn" onclick="sendExample(this.textContent)">アスベストの健康被害について教えてください</button>
          <button class="example-btn" onclick="sendExample(this.textContent)">アスベスト除去作業の法的規制は何ですか？</button>
          <button class="example-btn" onclick="sendExample(this.textContent)">建材にアスベストが含まれているか調べる方法は？</button>
          <button class="example-btn" onclick="sendExample(this.textContent)">中皮腫とアスベストの関係を説明してください</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <textarea
        id="userInput"
        placeholder="石綿について質問してください..."
        rows="1"
        onkeydown="handleKeyDown(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button id="sendBtn" onclick="sendMessage()">送信</button>
    </div>
  </div>

  <script>
    // ============================================================
    // ★ APIキーをここに設定してください
    // ============================================================
    const ANTHROPIC_API_KEY = 'YOUR_API_KEY_HERE';
    // ============================================================

    const MODEL = 'claude-opus-4-7';
    const SYSTEM_PROMPT = 'あなたは石綿（アスベスト）の専門家です。石綿の危険性、法規制、除去方法、健康被害、調査方法などについて正確に答えてください。';

    let conversationHistory = [];
    let isLoading = false;

    const chatWindow = document.getElementById('chatWindow');
    const userInput  = document.getElementById('userInput');
    const sendBtn    = document.getElementById('sendBtn');

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function sendExample(text) {
      userInput.value = text;
      autoResize(userInput);
      sendMessage();
    }

    function removeWelcome() {
      const welcome = document.getElementById('welcomeMsg');
      if (welcome) welcome.remove();
    }

    function appendMessage(role, content, id) {
      const wrap = document.createElement('div');
      wrap.className = 'message ' + role;
      if (id) wrap.id = id;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? '👤' : '🔬';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = content;

      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      chatWindow.appendChild(wrap);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return wrap;
    }

    function appendLoadingMessage() {
      const id = 'loading-' + Date.now();
      const wrap = document.createElement('div');
      wrap.className = 'message assistant';
      wrap.id = id;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = '🔬';

      const bubble = document.createElement('div');
      bubble.className = 'bubble loading';
      bubble.textContent = '回答を生成中...';

      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      chatWindow.appendChild(wrap);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return id;
    }

    function updateMessage(id, content, isError) {
      const wrap = document.getElementById(id);
      if (!wrap) return;
      const bubble = wrap.querySelector('.bubble');
      bubble.classList.remove('loading');
      if (isError) {
        bubble.classList.add('error-msg');
      }
      bubble.textContent = content;
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isLoading) return;

      if (ANTHROPIC_API_KEY === 'YOUR_API_KEY_HERE') {
        alert('ANTHROPIC_API_KEY を設定してください。HTMLファイル内の ANTHROPIC_API_KEY 変数にAPIキーを入力してください。');
        return;
      }

      removeWelcome();
      isLoading = true;
      sendBtn.disabled = true;
      userInput.value = '';
      userInput.style.height = 'auto';

      appendMessage('user', text);
      conversationHistory.push({ role: 'user', content: text });

      const loadingId = appendLoadingMessage();

      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': ANTHROPIC_API_KEY,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: MODEL,
            max_tokens: 2048,
            system: SYSTEM_PROMPT,
            messages: conversationHistory
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          const errMsg = errData?.error?.message || `HTTPエラー ${response.status}`;
          throw new Error(errMsg);
        }

        const data = await response.json();
        const assistantText = data.content?.[0]?.text ?? '（応答なし）';

        conversationHistory.push({ role: 'assistant', content: assistantText });
        updateMessage(loadingId, assistantText, false);

      } catch (err) {
        const errMsg = `エラー: ${err.message}`;
        conversationHistory.pop(); // remove the user message that failed
        updateMessage(loadingId, errMsg, true);
      } finally {
        isLoading = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }
  </script>
</body>
</html>
